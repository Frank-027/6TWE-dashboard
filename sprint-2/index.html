<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard-Sprint1</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1 id="title">Dashboard - Sprint 2</h1>
      <p>Energiestromen per dag</p>
    </header>

    <main>
      <section class="datum-selectie">
        <label for="datum">Kies een datum:</label>

        <input type="date" id="datum">

        <button id="knop">Toon energie</button>
      </section>

      <p id="melding"></p>

      <section id="dashboard">

        <div class="kaart">
          <h2>Productie</h2>
          <p>
              <span id="productie">--</span> kWh
          </p>
        </div>

        <div class="kaart">
          <h2>Verbruik</h2>
          <p>
              <span id="verbruik">--</span> kWh
          </p>
        </div>

        <div class="kaart">
          <h2>Zelfverbruik</h2>
          <p>
              <span id="zelfverbruik">--</span> kWh
          </p>
        </div>

        <div class="kaart">
          <h2>Injectie</h2>
          <p>
              <span id="injectie">--</span> kWh
          </p>
        </div>

        <div class="kaart">
          <h2>Afname net</h2>
          <p>
              <span id="afname">--</span> kWh
          </p>
        </div>

      </section>

    </main>
    
    <footer>
      <p>Energy Dashboard - 6TWE</p>
      <p>Don Bosco Haacht</p>
      <p>Sprint 2 energie dashboard © F Demonie</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
